<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEO Visibility · רגבה · אוגוסט 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF6; --card:#FFFFFF; --ink:#17161D; --muted:#75727F; --faint:#A9A6B2;
    --line:#ECE9E2; --brand:#E11D3C; --brand-2:#FF5C7C; --brand-soft:#FDEAEE;
    --comp:#CFCCD8; --amber:#E8A11C; --pos:#1E9E6A; --neg:#D2483F;
    --shadow:0 1px 2px rgba(20,19,30,.04), 0 8px 24px rgba(20,19,30,.05); --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper); color:var(--ink); font-family:"Heebo",system-ui,-apple-system,Segoe UI,Arial,sans-serif; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
  .num{font-family:"Sora","Heebo",system-ui,sans-serif; font-feature-settings:"tnum" 1; letter-spacing:-.01em}
  .wrap{max-width:1120px; margin:0 auto; padding:0 22px 64px}
  .topbar{position:sticky; top:0; z-index:20; background:#0F0E14; backdrop-filter:saturate(1.2) blur(10px); border-bottom:1px solid rgba(255,255,255,.08)}
  .topbar .inner{max-width:1120px; margin:0 auto; padding:14px 22px; display:flex; align-items:center; gap:16px}
  .mark{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.02em}
  .mark .dot{width:11px; height:11px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 4px var(--brand-soft)}
  .mark small{font-weight:600; color:#9C99A6; font-size:12.5px; letter-spacing:.04em; text-transform:uppercase}
  .spacer{flex:1}
  .lang{display:inline-flex; border:1px solid rgba(255,255,255,.14); border-radius:10px; overflow:hidden; background:rgba(255,255,255,.06)}
  .lang button{font-family:inherit; font-weight:700; font-size:13px; border:0; background:transparent; color:#C9C7D0; padding:9px 12px; cursor:pointer}
  .lang button[aria-pressed="true"]{background:#fff; color:#0F0E14}
  .lang button:focus-visible{outline:2px solid var(--brand); outline-offset:-2px}
  .context{display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap; padding:24px 0 4px}
  .eyebrow{font-size:12.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--brand)}
  .context h1{font-family:"Sora","Heebo",sans-serif; font-size:clamp(26px,4vw,38px); margin:0; font-weight:800; letter-spacing:-.025em; line-height:1.05}
  .clientline{display:flex; align-items:center; gap:11px}
  .avatar{width:42px; height:42px; border-radius:12px; background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; display:grid; place-items:center; font-weight:800; font-size:17px; flex:none}
  .meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; color:var(--muted); font-size:13.5px; font-weight:600}
  .chip{display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:700; color:var(--muted)}
  .chip .live{width:7px;height:7px;border-radius:50%;background:var(--pos)}
  .srcwrap{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; padding:18px 0 6px}
  .srclbl{font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--faint)}
  .srcbar{display:flex; gap:8px; flex-wrap:wrap}
  .srcbtn{font-family:inherit; font-weight:700; font-size:13px; border:1px solid var(--line); background:var(--card); color:var(--muted); padding:8px 13px; border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; box-shadow:var(--shadow)}
  .srcbtn[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
  .srcbtn .sd{width:6px;height:6px;border-radius:50%}
  .srcbtn .sd.on{background:var(--pos)} .srcbtn .sd.off{background:var(--faint)}
  .srcbtn:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
  .info{position:relative; display:inline-flex; vertical-align:middle; margin-inline-start:6px}
  .info .i{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--faint); color:var(--muted); font-size:11px; font-weight:800; line-height:1; display:grid; place-items:center; cursor:pointer; font-family:"Sora",sans-serif; background:var(--card)}
  .info .tip{display:none; position:absolute; top:150%; inset-inline-end:-6px; width:min(280px,76vw); background:var(--ink); color:#fff; font-weight:600; font-size:12px; line-height:1.55; padding:11px 13px; border-radius:11px; box-shadow:0 10px 30px rgba(20,19,30,.22); z-index:40; text-align:start}
  .info:hover .tip, .info:focus-within .tip, .info.open .tip{display:block}
  .info .i:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
  .grid{display:grid; gap:16px}
  .hero-grid{grid-template-columns:1.15fr 1fr; align-items:stretch}
  .two{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:22px; box-shadow:var(--shadow)}
  .card h2{font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 16px; display:flex; align-items:center}
  .card .sub{color:var(--faint); font-weight:600; font-size:12px}
  .hero{display:flex; gap:22px; align-items:center}
  .ring{flex:none; width:188px; height:188px; position:relative}
  .ring .center{position:absolute; inset:0; display:grid; place-content:center; text-align:center}
  .ring .big{font-family:"Sora",sans-serif; font-size:42px; font-weight:800; line-height:1}
  .ring .big sup{font-size:18px; font-weight:700; color:var(--muted)}
  .ring .lbl{font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:6px}
  .hero .copy{flex:1; min-width:0}
  .hero .copy p{margin:0 0 16px; color:var(--muted); font-weight:600}
  .hero .copy strong{color:var(--ink)}
  .sovbars{display:flex; flex-direction:column; gap:9px}
  .sovbars.cols{display:grid; grid-template-columns:1fr 1fr; gap:11px 30px}
  .sovbars.cols .sovrow .track{height:11px; background:#F6EEF0}
  .sovbars.cols .sovrow .fill{background:#F4A6B8}
  .sovbars.cols .sovrow.own .fill{background:linear-gradient(90deg,var(--brand),var(--brand-2))}
  .sovrow{display:grid; grid-template-columns:84px 1fr 46px; align-items:center; gap:10px; font-size:13px}
  .sovrow .name{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sovrow .track{height:9px; background:#F1EFE9; border-radius:999px; overflow:hidden}
  .sovrow .fill{height:100%; border-radius:999px; background:var(--comp)}
  .sovrow.own .fill{background:linear-gradient(90deg,var(--brand),var(--brand-2))}
  .sovrow.own .name{color:var(--brand)} .sovrow .val{text-align:end; font-weight:700; color:var(--muted)} .sovrow.own .val{color:var(--brand)}
  .kpi .k-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .kpi .k-label{font-size:12.5px; font-weight:700; color:var(--muted); display:flex; align-items:center}
  .kpi .k-val{font-family:"Sora",sans-serif; font-size:32px; font-weight:800; letter-spacing:-.02em; margin:10px 0 2px; line-height:1}
  .kpi .k-val sup{font-size:15px; color:var(--muted)} .kpi .k-val .den{font-size:18px; color:var(--faint)}
  .kpi .k-sub{font-size:12px; font-weight:600; color:var(--faint)}
  .kpi .glyph{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand)} .kpi .glyph svg{width:16px;height:16px}
  .trendbox{direction:ltr; position:relative}
  .trendbox .ylabels{position:absolute; inset-block:0; left:0; width:22px; pointer-events:none}
  .trendbox .ylabels span{position:absolute; left:0; width:20px; text-align:right; transform:translateY(-50%); font-size:10.5px; font-weight:700; color:var(--faint)}
  .trendstats{display:flex; gap:30px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line)}
  .trendstats .ts{display:flex; flex-direction:column; gap:2px}
  .trendstats .ts-v{font-family:"Sora",sans-serif; font-size:24px; font-weight:800; line-height:1; color:var(--ink)}
  .trendstats .ts:first-child .ts-v{color:var(--brand)}
  .trendstats .ts-l{font-size:12px; font-weight:600; color:var(--muted)}
  .axislabels{direction:ltr; display:flex; justify-content:space-between; margin-top:8px; padding:0 2% 0 5%; color:var(--faint); font-size:11px; font-weight:600}
  .mlist{display:flex; flex-direction:column; gap:11px}
  .mrow{display:grid; grid-template-columns:78px 1fr 30px; align-items:center; gap:10px; font-size:13px}
  .mrow .name{font-weight:700} .mrow.own .name{color:var(--brand)}
  .mrow .track{height:22px; background:#F5F3EE; border-radius:7px; overflow:hidden; display:flex} .mrow .seg{height:100%}
  .mrow .seg.solo{background:linear-gradient(90deg,var(--brand),var(--brand-2))} .mrow .seg.shared{background:var(--brand-soft)}
  .mrow.comp .seg.solo{background:var(--comp)} .mrow.comp .seg.shared{background:#E7E5EE}
  .mrow .v{text-align:end; font-weight:800; font-family:"Sora",sans-serif}
  .legend{display:flex; gap:16px; margin-top:14px; font-size:12px; font-weight:600; color:var(--muted); flex-wrap:wrap}
  .legend span{display:inline-flex; align-items:center; gap:7px} .legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
  .clusters{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .cl{border:1px solid var(--line); border-radius:13px; overflow:hidden; background:#fff}
  .cl summary{list-style:none; cursor:pointer; padding:15px 18px; display:flex; align-items:center; gap:12px}
  .cl summary::-webkit-details-marker{display:none}
  .cl .idx{font-family:"Sora",sans-serif; font-weight:800; color:var(--faint); font-size:13px; width:22px; flex:none}
  .cl .cn{flex:1; min-width:0} .cl .cn b{display:block; font-weight:700; font-size:15px}
  .ratio{font-family:"Sora",sans-serif; font-weight:800; font-size:13px; color:var(--muted)}
  .status{font-size:11px; font-weight:800; padding:4px 9px; border-radius:999px; white-space:nowrap}
  .status.full{background:#E7F6EE; color:#157a4f} .status.part{background:#FBF1DD; color:#9a6a09} .status.opp{background:#FDEAEE; color:#B0173A}
  .cl .caret{color:var(--faint); transition:transform .2s; flex:none} .cl[open] .caret{transform:rotate(180deg)}
  .cl .qs{padding:0 16px 14px; display:flex; flex-direction:column; gap:2px}
  .qrow{display:flex; gap:11px; padding:10px 4px; border-top:1px solid var(--line)}
  .qrow .qmark{flex:none; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; margin-top:1px}
  .qrow .qmark.hit{background:#E7F6EE; color:var(--pos)} .qrow .qmark.miss{background:#F4F2EC; color:var(--faint)}
  .qrow .qmark svg{width:12px;height:12px}
  .qbody{flex:1; min-width:0}
  .qtext{font-size:13px; line-height:1.45; color:var(--ink)} .qrow.miss .qtext{color:var(--muted)}
  .qpages{display:flex; flex-direction:column; gap:3px; margin-top:6px}
  .qpages a{font-size:12px; color:var(--brand); text-decoration:none; font-weight:600; word-break:break-all; direction:ltr; text-align:start}
  .qpages a:hover{text-decoration:underline} .qpages a .pn{color:var(--faint); direction:rtl}
  .rows{display:flex; flex-direction:column}
  .prow{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line)} .prow:first-child{border-top:0}
  .prow .badge{font-family:"Sora",sans-serif; font-weight:800; font-size:14px; min-width:30px; height:30px; padding:0 8px; border-radius:9px; display:grid; place-items:center; background:var(--brand-soft); color:var(--brand); flex:none}
  .prow .pt{flex:1; min-width:0} .prow .pt b{display:block; font-weight:700; font-size:14px}
  .prow .pt a{color:var(--muted); font-weight:600; font-size:12px; word-break:break-all; direction:ltr; display:inline-block; text-decoration:none} .prow .pt a:hover{color:var(--brand); text-decoration:underline}
  .drow{display:grid; grid-template-columns:1fr 60px 38px; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); font-size:13.5px} .drow:first-child{border-top:0}
  .drow .dn{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis} .drow .dt{height:7px; background:#F1EFE9; border-radius:999px; overflow:hidden}
  .drow .df{height:100%; background:var(--comp); border-radius:999px} .drow.own .dn{color:var(--brand)} .drow.own .df{background:linear-gradient(90deg,var(--brand),var(--brand-2))}
  .drow .dv{text-align:end; font-weight:800; font-family:"Sora",sans-serif; color:var(--muted)}
  .tag{font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:6px; margin-inline-start:8px; vertical-align:middle} .tag.brand{background:var(--brand-soft); color:var(--brand)} .tag.dir{background:#F2F1ED; color:var(--faint)}
  .sechead{display:flex; align-items:center; gap:12px; margin:30px 2px 4px}
  .sechead h2{font-family:"Sora","Heebo",sans-serif; font-size:19px; font-weight:800; margin:0; letter-spacing:-.01em; display:flex; align-items:center}
  .sechead .line{flex:1; height:1px; background:var(--line)} .sechead .count{color:var(--faint); font-weight:700; font-size:13px}
  .emptysrc{text-align:center; padding:54px 24px}
  .emptysrc .ic{width:52px;height:52px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px}
  .emptysrc h3{margin:0 0 8px;font-size:19px;font-weight:800} .emptysrc p{margin:0 auto;max-width:440px;color:var(--muted);font-weight:600}
  footer{margin-top:34px; padding-top:20px; border-top:1px solid var(--line); color:var(--faint); font-size:12.5px; font-weight:600; line-height:1.7} footer b{color:var(--muted)}
  .rego{height:30px; width:auto; display:block}
  .logobox{height:46px; padding:6px 12px; background:#fff; border:1px solid var(--line); border-radius:12px; display:inline-flex; align-items:center; box-shadow:var(--shadow)}
  .clogo{height:26px; width:auto; display:block}
  .prepared{margin-top:18px; background:#0F0E14; border-radius:14px; padding:15px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .prepared img{height:26px; width:auto} .prepared span{color:#C9C7D0; font-weight:600; font-size:12.5px}
  .arow{display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-top:1px solid var(--line)} .arow:first-child{border-top:0}
  .abolt{flex:none; width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin-top:1px} .abolt svg{width:15px;height:15px}
  .atext{flex:1; min-width:0; font-size:14px; font-weight:600; line-height:1.45}
  .alink{flex:none; font-size:12px; font-weight:700; color:var(--brand); text-decoration:none; border:1px solid var(--line); padding:5px 10px; border-radius:8px; white-space:nowrap} .alink:hover{background:var(--brand-soft)}
  .aempty{color:var(--faint); font-weight:600; padding:6px 0}
  @media (max-width:880px){ .hero-grid,.two,.clusters{grid-template-columns:1fr} .kpis{grid-template-columns:1fr 1fr} .hero{flex-direction:column; align-items:flex-start} .ring{margin:0 auto} .sovbars.cols{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
  .mchip{display:inline-block;font-size:11px;font-weight:700;color:#1E9E6A;background:rgba(30,158,106,.1);border:1px solid rgba(30,158,106,.28);border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:1px}
  .extmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .extdom{font-weight:800;font-size:15px}
  .extcnt{font-size:12.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:3px 11px}
  .exttitle{font-weight:700;color:var(--ink);text-decoration:none;font-size:15px}
  .exttitle:hover{color:var(--brand)}
  /* ===== cluster view (added 2026-08) ===== */
  .viewsw{display:inline-flex; border:1px solid rgba(255,255,255,.14); border-radius:10px; overflow:hidden; background:rgba(255,255,255,.06); margin-inline-end:10px}
  .viewsw button{font-family:inherit; font-weight:700; font-size:13px; border:0; background:transparent; color:#C9C7D0; padding:9px 13px; cursor:pointer; white-space:nowrap}
  .viewsw button[aria-pressed="true"]{background:var(--brand); color:#fff}
  .viewsw button:focus-visible{outline:2px solid var(--brand); outline-offset:-2px}
  .cv-hero{display:grid; grid-template-columns:minmax(230px,.85fr) 1.35fr; gap:26px; align-items:center}
  .cv-big{font-family:"Sora",sans-serif; font-size:64px; font-weight:800; line-height:1; letter-spacing:-.03em; color:var(--brand)}
  .cv-big .cv-den{font-size:24px; color:var(--faint); font-weight:700}
  .cv-delta{display:inline-flex; align-items:center; gap:6px; margin-top:12px; font-size:13px; font-weight:800; padding:6px 11px; border-radius:999px}
  .cv-delta.pos{background:#E7F6EE; color:#157a4f} .cv-delta.neg{background:#FDEAEE; color:#B0173A} .cv-delta.flat{background:#F2F1ED; color:var(--muted)}
  .cv-herobars{display:flex; flex-direction:column; gap:15px}
  .cv-barhead{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:5px}
  .cv-barhead i{font-style:normal; font-size:11px; font-weight:800; color:var(--faint); background:#F5F3EE; padding:1px 6px; border-radius:5px; margin-inline-start:4px}
  .cv-barhead b{font-family:"Sora",sans-serif; font-size:17px; color:var(--ink)}
  .cv-track{display:block; height:10px; background:#F1EFE9; border-radius:999px; overflow:hidden}
  .cv-track.sm{height:6px; margin-top:5px}
  .cv-fill{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--brand),var(--brand-2))}
  .cv-prevline{margin-top:5px; font-size:11.5px; font-weight:600; color:var(--faint)}
  .cv-prevline b{color:var(--muted)}
  .cv-table{padding:18px 20px 20px}
  .cv-head,.cv-row{display:grid; grid-template-columns:minmax(190px,1.7fr) .85fr .95fr .8fr .95fr 1.15fr; gap:12px; align-items:center}
  .cv-head{padding:0 6px 10px; border-bottom:1px solid var(--line)}
  .cv-head .cv-c{font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); display:flex; align-items:center}
  .cv-row{padding:14px 6px; border-bottom:1px solid var(--line)}
  .cv-row:last-of-type{border-bottom:0}
  .cv-row.feat{background:linear-gradient(90deg,var(--brand-soft),rgba(253,234,238,0)); border-radius:12px; padding:20px 12px; margin:4px 0; border-bottom:1px solid var(--line)}
  .cv-row .cv-v{font-family:"Sora",sans-serif; font-weight:800; font-size:18px; display:block; line-height:1.15}
  .cv-row.feat .cv-v{font-size:24px}
  .cv-row small{display:block; font-size:11px; font-weight:600; color:var(--faint); margin-top:2px}
  .cv-name{display:flex; align-items:center; gap:10px}
  .cv-name b{font-size:14.5px; font-weight:700; display:block; line-height:1.25}
  .cv-row.feat .cv-name b{font-size:18px}
  .cv-idx{font-family:"Sora",sans-serif; font-weight:800; color:var(--faint); font-size:12px; flex:none}
  .cv-row.feat .cv-idx{color:var(--brand)}
  .cv-score{margin-inline-start:auto; font-family:"Sora",sans-serif; font-weight:800; font-size:14px; color:#fff; background:var(--comp); border-radius:8px; padding:3px 9px; flex:none}
  .cv-row.feat .cv-score{background:linear-gradient(135deg,var(--brand),var(--brand-2)); font-size:17px; padding:5px 12px}
  .cv-spark{display:block; color:var(--comp); margin-bottom:4px; width:100%; max-width:130px; height:30px}
  .cv-trend.up .cv-spark{color:var(--pos)} .cv-trend.down .cv-spark{color:var(--neg)}
  .cv-pill{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; background:#F2F1ED; color:var(--muted)}
  .cv-trend.up .cv-pill,.cv-pill.up{background:#E7F6EE; color:#157a4f}
  .cv-trend.down .cv-pill,.cv-pill.down{background:#FDEAEE; color:#B0173A}

let lang = "he", source = (SOURCES.find(s=>DATA.sources[s.id] && DATA.sources[s.id].tracked)||{id:"chatgpt"}).id;
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number.isInteger(n)? n : Math.round(n*10)/10;
const info = txt => `<span class="info"><span class="i" tabindex="0" role="button" aria-label="info">i</span><span class="tip">${esc(txt)}</span></span>`;

function ring(v){ const r=78,c=2*Math.PI*r,off=c*(1-v/100);
  return `<svg viewBox="0 0 188 188" width="188" height="188" role="img" aria-label="${fmt(v)}%">
   <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E11D3C"/><stop offset="1" stop-color="#FF5C7C"/></linearGradient></defs>
   <circle cx="94" cy="94" r="${r}" fill="none" stroke="#F1EFE9" stroke-width="15"/>
   <circle cx="94" cy="94" r="${r}" fill="none" stroke="url(#rg)" stroke-width="15" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 94 94)" style="transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)"/></svg>`; }

function trend(daily,startISO){ const W=520,H=180,pl=26,pr=10,pt=16,pb=8,n=daily.length;
  const peak=Math.max(...daily,0), max=Math.max(peak,1);
  const x=i=>pl+i*(W-pl-pr)/(n-1), y=v=>pt+(1-v/max)*(H-pt-pb);
  const pts=daily.map((v,i)=>[x(i),y(v)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=`M ${x(0).toFixed(1)} ${(H-pb).toFixed(1)} `+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+` L ${x(n-1).toFixed(1)} ${(H-pb).toFixed(1)} Z`;
  const last=pts[n-1], sd=new Date(startISO);
  const dl=i=>{const d=new Date(sd);d.setDate(sd.getDate()+i);return d.getDate()+"/"+(d.getMonth()+1);};
  const ticks=[0,Math.round((n-1)/2),n-1].map(i=>`<span>${dl(i)}</span>`).join("");
  const yv = peak<=1?[0,1]:(peak<=4?[0,peak]:[0,Math.round(peak/2),peak]);
  const grid = yv.map(v=>`<line x1="${pl}" y1="${y(v).toFixed(1)}" x2="${(W-pr).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join("");
  const ylab = yv.map(v=>`<span style="top:${y(v).toFixed(1)}px">${v}</span>`).join("");
  return `<div class="trendbox"><div class="ylabels">${ylab}</div><svg viewBox="0 0 ${W} ${H}" width="100%" height="180" preserveAspectRatio="none" role="img">
   <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E11D3C" stop-opacity=".22"/><stop offset="1" stop-color="#E11D3C" stop-opacity="0"/></linearGradient></defs>
   ${grid}<path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="#E11D3C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="#fff" stroke="#E11D3C" stroke-width="2.5"/></svg>
   <div class="axislabels">${ticks}</div></div>`; }

const checkSvg = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const dashSvg  = '<svg viewBox="0 0 24 24"><path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';

function kic(t){const p={ment:'<path d="M4 5h16v10H8l-4 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  cite:'<path d="M7 8h10M7 12h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/>',
  sov:'<path d="M3 13a9 9 0 1 0 9-9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 12l5-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'}[t];
  return `<span class="glyph"><svg viewBox="0 0 24 24">${p}</svg></span>`;}

function statusOf(c){ return c>=3 ? "full" : (c>=1 ? "part" : "opp"); }

function srcBar(t){
  return `<div class="srcwrap"><span class="srclbl">${t.srcTitle}</span><div class="srcbar">
    ${SOURCES.filter(s=>DATA.sources[s.id] && DATA.sources[s.id].tracked).map(s=>{
      const dot = `<span class="sd on"></span>`;
      return `<button class="srcbtn" data-src="${s.id}" ${source===s.id?'aria-pressed="true"':''}>${dot}${s.label}</button>`;
    }).join("")}
  </div></div>`;
}

function render(){
  const _root0 = DATA.sources[source];
  const _src0 = (clusterScope!=null && _root0 && _root0.byCluster) ? _root0.byCluster[clusterScope] : _root0;
  const totalQ = (_src0 && _src0.tracked && Array.isArray(_src0.clusters)) ? _src0.clusters.reduce((a,c)=>a+c.q.length,0) : (DATA.totalQueries||48);
  const _fill = s => s.replace(/\{brand\}/g, DATA.name[lang]).replace(/\{domain\}/g, DATA.domain).replace(/\{n\}/g, String(totalQ));
  const t = Object.fromEntries(Object.entries(DICT[lang]).map(([k,v]) => [k, (typeof v === "string") ? _fill(v) : v]));
  document.documentElement.lang=lang; document.documentElement.dir = lang==="he"?"rtl":"ltr";
  $("#markSub").textContent=t.geoSub;
  $("#langHe").setAttribute("aria-pressed",lang==="he"); $("#langEn").setAttribute("aria-pressed",lang==="en");

  const head = `
    <div class="context">
      <div class="clientline">${CLIENT_LOGO?`<span class="logobox"><img class="clogo" src="${CLIENT_LOGO}" alt="${esc(DATA.name[lang])}"></span>`:""}
        <div><div class="eyebrow">${t.report} · ${esc(DATA.period[lang])}</div><h1>${esc(DATA.name[lang])}</h1></div></div>
      <div class="spacer"></div>
      <div class="meta">

  return `<svg class="cv-spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="${x(30).toFixed(1)}" y1="1" x2="${x(30).toFixed(1)}" y2="${H-1}" stroke="var(--line)" stroke-width="1"/>
    <path d="${v.map((q,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(q).toFixed(1)).join(" ")}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
const cvMetrics     = c => cvModel==="syn" ? c.syn      : c.per[cvModel];
const cvMetricsPrev = c => cvModel==="syn" ? c.synPrev  : c.per[cvModel].prev;
const cvPages       = c => cvModel==="syn" ? c.pages.length : c.per[cvModel].pages;

/* ---------- cluster selector shown inside the drill-down view ---------- */
function clBar(){
  const t=CDICT[lang];
  const items=[`<button class="srcbtn clbtn" data-cl="all" ${clusterScope==null?'aria-pressed="true"':''}>${t.clAll}</button>`]
    .concat(CLUSTER.clusters.map((c,i)=>`<button class="srcbtn clbtn" data-cl="${i}" ${clusterScope===i?'aria-pressed="true"':''}>${String(i+1).padStart(2,'0')} · ${c.name[lang]}</button>`));
  return `<div class="srcwrap clwrap"><span class="srclbl">${t.clBarLbl}</span><div class="srcbar">${items.join("")}</div></div>`
    + (clusterScope!=null?`<div class="cv-scopenote">${t.scopeNote}</div>`:``);
}

/* ---------- gap panel rendered under the queries, inside the drill-down ---------- */
function gapPanel(d){
  if(clusterScope==null || !d || !d.gap) return "";
  const t=CDICT[lang], g=d.gap, C=CLUSTER.clusters[clusterScope];
  const rec=(CLUSTER.recs||[]).find(r=>r.clusterIdx===clusterScope);
  const stat=(lbl,now,prevv,tot)=>{
    const dl=now-prevv;
    return `<div class="cv-gstat"><span class="cv-gl">${lbl}</span>
      <span class="cv-gv num">${now}<small>/${tot}</small></span>
      <span class="cv-gd ${dl>0?'pos':(dl<0?'neg':'flat')}">${cvArrow(dl>0?'up':(dl<0?'down':'flat'))} ${dl>0?'+':''}${dl}</span>
      <span class="cv-gprev">${t.gapVs}: <b class="num">${prevv}</b>/${tot}</span></div>`;
  };
  const qlist=(title,arr)=>arr.length?`<div class="cv-gblock"><b>${title} (${arr.length})</b>
      <div class="cv-recq">${arr.map(q=>`<span>✗ ${esc(q)}</span>`).join("")}</div></div>`:``;
  return `
  <div class="card cv-gap">
    <h2>${t.gapH} <span class="sub">&middot;&nbsp;${esc(C.name[lang])}</span></h2>
    <div class="cv-gstats">
      ${stat(t.gapMention, g.mention, g.prevMention, g.n)}
      ${stat(t.gapCite, g.cited, g.prevCited, g.n)}
    </div>
    <div class="cv-glegend">${t.gapLegend}</div>
    ${(!g.zeroQ.length && !g.noCiteQ.length)?`<div class="cv-gnone">${t.gapNone}</div>`:``}
    ${qlist(t.gapNoMention, g.zeroQ)}
    ${qlist(t.gapNoCite, g.noCiteQ)}
    ${g.sites&&g.sites.length?`<div class="cv-gblock"><b>${t.gapSites}</b>
      <div class="cv-recsites">${g.sites.map(s=>`<code>${esc(s)}</code>`).join(" ")}</div></div>`:``}
    ${rec?`<div class="cv-grec"><span class="cv-recp ${rec.prio}">${esc(rec.prioLabel[lang])}</span><div>${esc(rec.action[lang])}</div></div>`:``}
  </div>`;
}

function renderClusters(){
  const t = CDICT[lang];
  document.documentElement.lang=lang; document.documentElement.dir = lang==="he"?"rtl":"ltr";
  $("#markSub").textContent = DICT[lang].geoSub;
  $("#langHe").setAttribute("aria-pressed",lang==="he"); $("#langEn").setAttribute("aria-pressed",lang==="en");
  const C = CLUSTER, ov=C.overall.cur, ovp=C.overall.prev;
  const dScore = +(ov.score - ovp.score).toFixed(1);
  const feat = C.clusters[0];

  const head = `
    <div class="context">
      <div class="clientline">${CLIENT_LOGO?`<span class="logobox"><img class="clogo" src="${CLIENT_LOGO}" alt="${esc(DATA.name[lang])}"></span>`:""}
        <div><div class="eyebrow">${DICT[lang].report} · ${esc(DATA.period[lang])}</div><h1>${esc(DATA.name[lang])}</h1></div></div>
      <div class="spacer"></div>
      <div class="meta">
        <span class="chip"><span class="live"></span>${DICT[lang].live}</span>
        <span class="chip">${DICT[lang].market}: ${esc(DATA.market)}</span>
        <span class="chip">${DATA.totalQueries} ${t.ofQ} · 5 ${lang==="he"?"קלסטרים":"clusters"}</span></div>
    </div>`;

  const hero = `
    <div class="card cv-hero" style="margin-top:14px">
      <div class="cv-heroleft">
        <h2 style="margin-bottom:10px">${t.indexH}${info(t.indexTip)}</h2>
        <div class="cv-big num">${ov.score}<span class="cv-den">/100</span></div>
        <div class="cv-delta ${dScore>0?'pos':(dScore<0?'neg':'flat')}">${cvArrow(dScore>0?'up':(dScore<0?'down':'flat'))}
          <span>${dScore>0?'+':''}${dScore} ${t.pts} · ${t.vsPrev}</span></div>
      </div>
      <div class="cv-herobars">
        ${[['compSov','sov',C.weightsMix.sov],['compVis','vis',C.weightsMix.vis],['compMent','ment',C.weightsMix.ment]].map(([k,f,w])=>`
          <div class="cv-bar">
            <div class="cv-barhead"><span>${t[k]} <i>${w}%</i></span><b class="num">${ov[f]}%</b></div>
            <span class="cv-track"><span class="cv-fill" style="width:${ov[f]}%"></span></span>
            <div class="cv-prevline">${t.vsPrev}: <b>${ovp[f]}%</b></div>
          </div>`).join("")}
      </div>
    </div>`;

  const modelBar = `
    <div class="srcwrap"><span class="srclbl">${t.modelsH}</span><div class="srcbar">
      <button class="srcbtn cvbtn" data-cvm="syn" ${cvModel==="syn"?'aria-pressed="true"':''}><span class="sd on"></span>${t.modelSyn}</button>
      ${C.models.map(m=>`<button class="srcbtn cvbtn" data-cvm="${m.id}" ${cvModel===m.id?'aria-pressed="true"':''}><span class="sd on"></span>${m.label}<i class="cv-w">${m.w}%</i></button>`).join("")}
    </div></div>`;

  const rowHtml = (c,i)=>{
    const m=cvMetrics(c), p=cvMetricsPrev(c), tr=c.trend, dS=+(m.score-p.score).toFixed(1);
    return `<div class="cv-row ${i===0?'feat':''}" data-drill="${i}" role="button" tabindex="0" title="${esc(t.drill)}">
      <div class="cv-c cv-name">
        <span class="cv-idx num">${String(i+1).padStart(2,'0')}</span>
        <span><b>${esc(c.name[lang])}</b><small>${c.queries} ${t.ofQ}</small></span>
        <span class="cv-score num">${m.score}</span>
      </div>
      <div class="cv-c" data-l="${esc(t.colSov)}"><span class="cv-v num">${m.sov}%</span>
        <span class="cv-track sm"><span class="cv-fill" style="width:${m.sov}%"></span></span></div>
      <div class="cv-c" data-l="${esc(t.colVis)}"><span class="cv-v num">${m.vis}%</span>
        <small>${c.queries} ${t.ofQ}${cvModel==="syn"?` · ${C.models.length} ${lang==="he"?"מודלים":"models"}`:""}</small></div>
      <div class="cv-c" data-l="${esc(t.colPages)}"><span class="cv-v num">${cvPages(c)}</span><small>${t.pagesU}</small></div>
      <div class="cv-c" data-l="${esc(t.colMent)}"><span class="cv-v num">${tr.aug}</span><small>${t.perDay} · ${lang==="he"?"יולי":"Jul"} ${tr.jul}</small></div>
      <div class="cv-c cv-trend ${tr.dir}" data-l="${esc(t.colTrend)}">
        ${cvSpark(c.mentionsSeries)}
        <span class="cv-pill">${cvArrow(tr.dir)} ${t[tr.dir]} ${tr.delta>0?'+':''}${tr.delta}%</span>
        <small>${lang==="he"?"מדד":"index"} ${dS>0?'+':''}${dS} ${t.pts}</small></div>
      <span class="cv-drill">${t.drill} ›</span>
    </div>`;
  };

  const table = `
    <div class="sechead"><h2>${t.tableH}</h2><span class="line"></span><span class="count">${C.clusters.length}</span></div>
    <div class="card cv-table">
      <div class="cv-head">
        <div class="cv-c">${t.colCluster}</div>
        <div class="cv-c">${t.colSov}${info(t.sovTipC)}</div>
        <div class="cv-c">${t.colVis}${info(t.visTipC)}</div>
        <div class="cv-c">${t.colPages}${info(t.pagesTipC)}</div>
        <div class="cv-c">${t.colMent}${info(t.mentTipC)}</div>
        <div class="cv-c">${t.colTrend}</div>
      </div>
      ${C.clusters.map(rowHtml).join("")}
      <div class="sub" style="margin-top:14px">${t.tableNote}</div>
    </div>`;

  const fm=cvMetrics(feat), fcomp=feat.competitors.slice(0,10), fmax=Math.max(1,...fcomp.map(x=>x.r));
  const featured = `
    <div class="sechead"><h2>${t.featuredH}</h2><span class="line"></span><span class="count">${esc(feat.name[lang])}</span></div>
    <div class="grid two">
      <div class="card">
        <h2>${esc(feat.name[lang])} · <span class="sub">${t.featuredSub}</span></h2>
        <div class="cv-featgrid">
          ${[[t.colSov,fm.sov+"%"],[t.colVis,fm.vis+"%"],[t.colPages,cvPages(feat)],[t.colMent,feat.trend.aug]].map(([a,b])=>`
            <div class="cv-kpi"><span class="cv-kl">${a}</span><span class="cv-kv num">${b}</span></div>`).join("")}
        </div>
        <div class="cv-featscore">
          <span>${t.indexH}</span><b class="num">${fm.score}</b><span class="cv-den2">${t.of100}</span>
          <span class="cv-pill ${feat.trend.dir}">${cvArrow(feat.trend.dir)} ${t[feat.trend.dir]}</span>
          <button class="cv-drillbtn" data-drill="0">${t.drill} ›</button>
        </div>
      </div>
      <div class="card">
        <h2>${t.compH}</h2>
        <div class="sovbars cv-compbars">${fcomp.map(x=>`
          <div class="sovrow ${x.own?'own':''}"><span class="name">${esc(x.name[lang])}</span>
            <span class="track"><span class="fill" style="width:${(x.r/fmax*100).toFixed(1)}%"></span></span>
            <span class="val num">${x.r}</span></div>`).join("")}</div>
        <div class="sub" style="margin-top:12px">${t.compNote}</div>
      </div>
    </div>`;

  const mx = `
    <div class="sechead"><h2>${t.matrixH}</h2><span class="line"></span></div>
    <div class="card">
      <div class="cv-mxwrap"><div class="cv-matrix" style="grid-template-columns:minmax(130px,1.6fr) repeat(${C.models.length+1},1fr)">
        <div class="cv-mh"></div>
        ${C.models.map(m=>`<div class="cv-mh">${m.label}<i class="cv-w">${m.w}%</i></div>`).join("")}
        <div class="cv-mh syn">${t.modelSyn}</div>
        ${C.clusters.map(c=>`
          <div class="cv-mn">${esc(c.name[lang])}</div>
          ${C.models.map(m=>{const v=c.per[m.id].score;return `<div class="cv-mc" style="background:rgba(225,29,60,${(v/100*0.82+0.05).toFixed(3)});color:${v>45?'#fff':'var(--ink)'}"><span class="num">${v}</span></div>`;}).join("")}
          <div class="cv-mc syn"><span class="num">${c.syn.score}</span></div>`).join("")}
      </div></div>
      <div class="sub" style="margin-top:14px">${t.matrixNote}</div>
      <div class="cv-thin"><b>${t.thinH}:</b> ${C.thin.map(x=>`${x.label} — ${esc(x.note[lang])}`).join(" · ")}</div>
      <div class="sub" style="margin-top:8px">${t.modelsNote}</div>
    </div>`;

  const rec = `
    <div class="sechead"><h2>${t.recH}</h2><span class="line"></span><span class="count">${C.recs.length}</span></div>
    <div class="card"><div class="rows">${C.recs.map((r,i)=>`
      <div class="cv-rec">
        <span class="cv-recn num">${String(i+1).padStart(2,'0')}</span>
        <div class="cv-recb">
          <b>${esc(r.cluster[lang])}</b>
          <div class="cv-recstats">
            <span>${t.recGapQ}: <b>${r.zero}</b>/${r.n}</span>
            <span>${t.recNoCite}: <b>${r.nocite}</b>/${r.n}</span>
            <button class="cv-drilllink" data-drill="${r.clusterIdx}">${t.drill} ›</button>
          </div>
          <div class="cv-recact">${esc(r.action[lang])}</div>
          ${r.sites&&r.sites.length?`<div class="cv-recsites"><span>${t.recSites}:</span> ${r.sites.map(s=>`<code>${esc(s)}</code>`).join(" ")}</div>`:""}
          ${r.queries&&r.queries.length?`<div class="cv-recq">${r.queries.map(q=>`<span>✗ ${esc(q)}</span>`).join("")}</div>`:""}
        </div>
        <span class="cv-recp ${r.prio}">${esc(r.prioLabel[lang])}</span>
      </div>`).join("")}</div>
      <div class="sub" style="margin-top:12px">${t.recNote}</div>
      <div class="cv-next"><b>${t.nextH}:</b> ${esc(C.next[lang])}</div>
    </div>`;

  $("#app").innerHTML = head + hero + modelBar + table + featured + mx + rec +
    `<footer><b>${DICT[lang].methodTitle}.</b> ${esc(C.method[lang])}</footer>
     <div class="prepared"><img src="${REGO_LOGO}" alt="ReGo"><span>${DICT[lang].preparedBy}</span></div>`;
}

function renderApp(){
  const b1=document.getElementById("viewDetail"), b2=document.getElementById("viewClusters");
  if(b1&&b2){
    b1.textContent=CDICT[lang].viewDetail; b2.textContent=CDICT[lang].viewClusters;
    b1.setAttribute("aria-pressed", view==="detail"); b2.setAttribute("aria-pressed", view==="clusters");
  }
  if(view==="clusters") renderClusters(); else render();
  window.scrollTo({top:0,behavior:"auto"});
}


$("#langHe").addEventListener("click",()=>{lang="he";renderApp();});
$("#langEn").addEventListener("click",()=>{lang="en";renderApp();});
document.addEventListener("click",e=>{
  const cb=e.target.closest(".cvbtn"); if(cb){ cvModel=cb.dataset.cvm; renderClusters(); return; }
  const clb=e.target.closest(".clbtn"); if(clb){ clusterScope=(clb.dataset.cl==="all")?null:+clb.dataset.cl; renderApp(); return; }
  const dr=e.target.closest("[data-drill]"); if(dr){ clusterScope=+dr.dataset.drill; if(cvModel!=="syn") source=cvModel; view="detail"; renderApp(); return; }
  const vb=e.target.closest("#viewDetail,#viewClusters"); if(vb){ view=(vb.id==="viewClusters")?"clusters":"detail"; renderApp(); return; }
  const sb=e.target.closest(".srcbtn"); if(sb && sb.dataset.src){ source=sb.dataset.src; renderApp(); return; }
  const ic=e.target.closest(".info .i");
  document.querySelectorAll(".info.open").forEach(el=>{ if(!ic || !el.contains(ic)) el.classList.remove("open"); });
  if(ic){ ic.parentElement.classList.toggle("open"); }
});
document.getElementById("regoLogo").src=REGO_LOGO;
document.addEventListener("keydown",e=>{ if(e.key!=="Enter"&&e.key!==" ")return; const d=e.target.closest&&e.target.closest("[data-drill]"); if(d){ e.preventDefault(); clusterScope=+d.dataset.drill; if(cvModel!=="syn") source=cvModel; view="detail"; renderApp(); } });
renderApp();
</script>
</body>
</html>
